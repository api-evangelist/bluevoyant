description: BlueVoyant is a cyber defense company that combines managed detection and response
  (MDR), digital risk protection, and supply-chain (third-party) cyber risk management into a
  cloud-native platform backed by a global security operations capability. It continuously monitors
  customers' internal networks, endpoints, and cloud along with their external attack surface and
  vendor ecosystem, using threat intelligence to detect, investigate, and remediate threats. BlueVoyant
  serves enterprises and governments across sectors and was added to the API Evangelist network as a
  portfolio lead (8vc); this profile is maintained by the enrichment pipeline against public sources.
